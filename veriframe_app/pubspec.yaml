name: veriframe_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.11.0+2
  cloud_firestore: ^6.3.0
  dio: ^5.4.0
  file_picker: ^11.0.2
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.0
  google_sign_in: ^6.2.1
  http: ^1.6.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  provider: ^6.1.0
  shared_preferences: ^2.5.5
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  # New dependencies
  flutter_svg: ^2.0.10
  google_fonts: ^7.0.0
  responsive_builder: ^0.4.2
  package_info_plus: ^8.0.0
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/veriframe_model.tflite
    - assets/labels.txt
  # Localization assets
  # The l10n tool will auto-detect ARB files under lib/l10n
  # No extra configuration needed for default settings
